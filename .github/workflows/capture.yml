name: Capture NY Harbor ULSD Price (Test Every 10 Mins)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install chromium

      - name: Run capture script
        run: python capture_ulsd.py

      - name: Commit and push changes back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ulsd_history.csv
          git diff --staged --quiet || (git commit -m "Test auto-update NY Harbor ULSD price" && git push)