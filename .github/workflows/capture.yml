name: Capture Market Data

on:
  schedule:
    - cron: '0 21 * * 1-5' # Runs Monday-Friday at 5:00 PM EST (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pandas matplotlib

      - name: Run capture script
        run: python capture.py

      - name: Commit and push updated graph/data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update market data and graph [skip ci]"
            git push
          fi